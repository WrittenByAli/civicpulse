name: Release

on:
  push:
    tags:
      - "v*"

# Least-privilege default
permissions:
  contents: read

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: pytest with coverage
        run: pytest --cov=app --cov-fail-under=65
        working-directory: backend

      - name: Frontend tests
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm ci
          npm run test -- --run
        working-directory: frontend

  build-push:
    name: Build & push semver tags to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.push-backend.outputs.digest }}
      frontend_digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semver
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:${{ steps.ver.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        id: push-frontend
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:${{ steps.ver.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit SBOM with Syft (backend)
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom-backend.spdx.json
          retention-days: 90

  create-release:
    name: Publish GitHub Release
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          name: "CivicPulse ${{ github.ref_name }}"
          generate_release_notes: true
          files: sbom-backend.spdx.json
          body: |
            ## Images

            ```
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ```

            Backend digest: `${{ needs.build-push.outputs.backend_digest }}`

            Deploy by SHA (immutable):
            ```bash
            kustomize edit set image backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            kubectl apply -k k8s/overlays/prod
            ```
