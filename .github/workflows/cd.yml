name: CD

on:
  push:
    branches: [main]

# Least-privilege default
permissions:
  contents: read

jobs:
  # ── 1. Full test suite on the merged result ───────────────────────────────
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"
        working-directory: backend

      - name: pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend

      - name: Frontend tests
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm ci
          npm run test -- --run
        working-directory: frontend

  # ── 2. Build & push to GHCR ───────────────────────────────────────────────
  build-push:
    name: Build & push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.push-backend.outputs.digest }}
      frontend_digest: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        id: push-frontend
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit SBOM with Syft (backend)
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-backend.spdx.json
          retention-days: 30

  # ── 3. Deploy to kind cluster ─────────────────────────────────────────────
  deploy-k8s:
    name: Deploy to kind cluster & smoke test
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Pin image tags in prod overlay
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }} \
            frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=120s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=120s

      - name: Smoke test via port-forward
        run: |
          kubectl port-forward svc/backend 8000:8000 -n civicpulse &
          sleep 5
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ready

      - name: Print HPA status
        run: kubectl get hpa -n civicpulse
