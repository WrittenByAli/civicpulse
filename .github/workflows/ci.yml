name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

# Least-privilege default — jobs escalate only what they need
permissions:
  contents: read

jobs:
  # ── 0. Detect optional components ────────────────────────────────────────
  detect:
    name: Detect optional components
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.probe.outputs.has_frontend }}
      has_k8s: ${{ steps.probe.outputs.has_k8s }}
      has_compose: ${{ steps.probe.outputs.has_compose }}
    steps:
      - uses: actions/checkout@v4
      - id: probe
        shell: bash
        run: |
          [ -f frontend/package.json ]                    && hf=true || hf=false
          [ -f k8s/overlays/prod/kustomization.yaml ]    && hk=true || hk=false
          [ -f compose.yaml ]                             && hc=true || hc=false
          echo "has_frontend=$hf"  >> "$GITHUB_OUTPUT"
          echo "has_k8s=$hk"       >> "$GITHUB_OUTPUT"
          echo "has_compose=$hc"   >> "$GITHUB_OUTPUT"

  # ── 1. Lint & type-check ─────────────────────────────────────────────────
  lint-and-type:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev deps
        run: |
          pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"
        working-directory: backend

      - name: ruff check
        run: ruff check app/
        working-directory: backend

      - name: mypy
        run: mypy app/ --ignore-missing-imports
        working-directory: backend

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "20"

      - name: Install frontend deps
        if: hashFiles('frontend/package.json') != ''
        run: npm install
        working-directory: frontend

      - name: eslint
        if: hashFiles('frontend/package.json') != ''
        run: npm run lint
        working-directory: frontend

      - name: tsc --noEmit
        if: hashFiles('frontend/package.json') != ''
        run: npm run type-check
        working-directory: frontend

  # ── 2. Backend tests ─────────────────────────────────────────────────────
  test-backend:
    name: Backend tests (coverage ≥ 65%)
    needs: lint-and-type
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: "redis://localhost:6379/15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install hatchling
          pip install -e ".[dev]"
        working-directory: backend

      - name: pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend

  # ── 3. Frontend tests ─────────────────────────────────────────────────────
  test-frontend:
    name: Frontend tests (≥ 5 Vitest tests)
    needs: [lint-and-type, detect]
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install
        working-directory: frontend

      - name: vitest
        run: npm run test -- --run
        working-directory: frontend

  # ── 4. Build images (no push — a PR must not publish artifacts) ───────────
  build:
    name: Build images (no push)
    needs: [test-backend, test-frontend]
    if: |
      always() &&
      needs.test-backend.result == 'success' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: civicpulse/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save backend image
        run: docker save civicpulse/backend:${{ github.sha }} -o /tmp/backend.tar

      - name: Build frontend image
        if: hashFiles('frontend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: civicpulse/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save frontend image
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker save civicpulse/frontend:${{ github.sha }} -o /tmp/frontend.tar

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp/*.tar
          retention-days: 1

  # ── 5. Trivy security scan ────────────────────────────────────────────────
  scan:
    name: Trivy security scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp

      - name: Load backend image
        run: docker load -i /tmp/backend.tar

      - name: Scan backend — fail on HIGH/CRITICAL (unfixed only)
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: civicpulse/backend:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Load frontend image
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker load -i /tmp/frontend.tar

      - name: Scan frontend — fail on HIGH/CRITICAL (unfixed only)
        if: hashFiles('frontend/Dockerfile') != ''
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: civicpulse/frontend:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ── 6. Validate K8s manifests ─────────────────────────────────────────────
  manifests:
    name: Validate K8s manifests (kustomize | kubeconform)
    needs: [build, detect]
    if: needs.detect.outputs.has_k8s == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin/

      - name: kustomize build overlays/prod | kubeconform
        run: |
          if [ ! -f k8s/overlays/prod/kustomization.yaml ]; then
            echo "No kustomization.yaml found — nothing to validate" && exit 0
          fi
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  # ── 7. Integration test ───────────────────────────────────────────────────
  integration:
    name: Integration test
    needs: [scan, manifests, detect]
    if: |
      always() &&
      needs.scan.result == 'success' &&
      (needs.manifests.result == 'success' || needs.manifests.result == 'skipped') &&
      needs.detect.outputs.has_compose == 'true'
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse
      POSTGRES_DB: civicpulse
      DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@postgres:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: /tmp

      - name: Load images
        run: |
          docker load -i /tmp/backend.tar
          [ -f /tmp/frontend.tar ] && docker load -i /tmp/frontend.tar || true

      - name: Tag images for compose
        run: |
          docker tag civicpulse/backend:${{ github.sha }} civicpulse/backend:ci
          docker image inspect civicpulse/frontend:${{ github.sha }} 2>/dev/null \
            && docker tag civicpulse/frontend:${{ github.sha }} civicpulse/frontend:ci || true

      - name: Start stack
        run: IMAGE_TAG=ci docker compose -f compose.yaml up -d

      - name: Wait for /ready (max 60 s)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready && echo " — ready" && break
            sleep 2
          done

      - name: POST complaint and assert category
        run: |
          RESP=$(curl -sf -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Water pipe burst on Main Street causing flooding","location":"Lahore"}')
          echo "$RESP"
          CATEGORY=$(echo "$RESP" | jq -r '.category')
          echo "category: $CATEGORY"
          echo "$CATEGORY" | grep -E '^(water|electricity|sanitation|roads|streetlights|other)$'
          COMPLAINT_ID=$(echo "$RESP" | jq -r '.id')
          echo "COMPLAINT_ID=$COMPLAINT_ID" >> "$GITHUB_ENV"

      - name: GET complaint back
        run: |
          GOT_ID=$(curl -sf "http://localhost:8000/api/complaints/$COMPLAINT_ID" | jq -r '.id')
          [ "$GOT_ID" = "$COMPLAINT_ID" ] || { echo "ID mismatch: $GOT_ID"; exit 1; }
          echo "GET ok: $GOT_ID"

      - name: X-Cache MISS then HIT
        run: |
          MISS=$(curl -sI http://localhost:8000/api/stats | grep -i x-cache | tr -d '\r')
          echo "First:  $MISS"
          echo "$MISS" | grep -i MISS
          HIT=$(curl -sI http://localhost:8000/api/stats | grep -i x-cache | tr -d '\r')
          echo "Second: $HIT"
          echo "$HIT" | grep -i HIT

      - name: Tear down
        if: always()
        run: docker compose down -v
