server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api calls to backend — frontend never needs an absolute backend URL.
    # This is the ADR-001 choice: nginx proxy instead of baking VITE_API_URL at build time.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /ready {
        proxy_pass http://backend:8000;
    }

    # SPA fallback — any unknown path serves index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
