[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic-settings>=2.4.0",
    "redis[asyncio]>=5.1.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "anyio>=4.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-bcrypt>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]
ignore = [
    "B008",  # Depends(...) in argument defaults is FastAPI's required DI pattern
]

[tool.ruff.lint.per-file-ignores]
# Fallback triage and readiness probes must catch any failure to degrade safely
"app/providers/triage/llm.py" = ["BLE001"]
"app/providers/triage/ollama.py" = ["BLE001"]
"app/routes/health.py" = ["BLE001"]
# Session context manager: rollback on any error, then re-raise
"app/database.py" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
