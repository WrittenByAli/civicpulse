# Production compose file — uses pre-built images, no build: keys,
# no published ports on database or cache.
# Usage: IMAGE_TAG=<sha> docker compose -f compose.prod.yaml up -d

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicpulse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-writtenbyali/civicpulse}/backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-civicpulse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-civicpulse}
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-rules}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-CivicPulse <noreply@civicpulse.app>}
      MAIN_OPERATOR_EMAIL: ${MAIN_OPERATOR_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    networks:
      - edge
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-writtenbyali/civicpulse}/backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    command: >
      sh -c "alembic upgrade head && [ -f /scripts/seed.py ] && python /scripts/seed.py || true"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-civicpulse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-civicpulse}
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: rules
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-writtenbyali/civicpulse}/frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    ports:
      - "80:8080"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
